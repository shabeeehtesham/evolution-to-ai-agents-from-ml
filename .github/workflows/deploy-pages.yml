# Retired: the static-JS demo site this deployed has been replaced by the
# server-side webapp/ (FastAPI + Streamlit, real Python inference). Kept as
# manual-only (workflow_dispatch) instead of deleted, in case the static site
# is ever needed again - to fully unpublish the live GitHub Pages URL, also
# disable Pages under repo Settings > Pages.
name: Deploy portfolio to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload portfolio-website as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "portfolio-website"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
